name: odoo-print

on:
  pull_request:
  push:
    branches:
      - "14.0"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t odoo-print-tester .
      - name: Run Tests in Docker
        run: docker run --rm odoo-print-tester
